name: QA suite

on:
  pull_request:
  push:
    branches: [main]

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
      # The suite auto-detects Chrome (/usr/bin/google-chrome is preinstalled on ubuntu-latest)
      # and otherwise falls back to Playwright's Chromium. Fonts come from fonts/ in the repo.
      - name: Run QA suite (95 tests, desktop + phone, EN + AR, offline)
        run: python tests/qa_suite.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-results
          path: tests/qa_results.json
          if-no-files-found: ignore
